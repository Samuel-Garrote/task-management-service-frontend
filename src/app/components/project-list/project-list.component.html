<div class="list-container">
  <h2>Projects</h2>
  @if (projects().length === 0) {
    <p class="empty-state">No projects yet.</p>
  } @else {
    @for (project of projects(); track project.id) {
      <a class="list-item" [routerLink]="['/projects', project.id, 'tasks']">
        {{ project.name }}
      </a>
    }
  }
</div>
